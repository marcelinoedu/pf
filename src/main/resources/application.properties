spring.application.name=avaliacoes-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/avaliacoes}
spring.datasource.username=${POSTGRES_USER:avaliacoes}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.mvc.problemdetails.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth0.com
spring.security.oauth2.resourceserver.jwt.audiences=https://api.avaliacoes.example.com
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.shutdown=graceful
