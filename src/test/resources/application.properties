spring.datasource.url=jdbc:h2:mem:avaliacoes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.mvc.problemdetails.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://tenant.example.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://api.example.com
